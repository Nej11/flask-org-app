<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script>
        function confirmDelete(user_id){
            var confirmation=confirm("you sure you wanna delete?")
            if(confirmation){
                var form=document.createElement('form');
                form.method='POST';
                form.action='/deleteuser/'+user_id;
                document.body.appendChild(form);
                form.submit();
            }
        }
    </script>
</head>
<body>
    <div class="my-5 text-center">
        
            <!-- 🔹 ADDING THE MESSAGE HERE -->
        <p class="alert alert-warning">
                ⚠️ You must add a team first before adding users to the team.
        </p>
        
            
        
        <button type="button" class="btn btn-primary">
            <a href="{{url_for('main.add_team')}}" class="text-white">Add Team</a>
        </button>
        <button type="button" class="btn btn-primary">
            <a href="{{url_for('main.add_user')}}" class="text-white">Add user</a>
        </button>
        <button type="button" class="btn btn-primary">
            <a href="{{url_for('main.list_teams')}}" class="text-white">Check Team</a>
        </button>
        <br/>
        <div class="w-70 d-flex p-5">
            <table class="table">
                <thead>
                  <tr>
                    <th scope="col">id</th>
                    <th scope="col">Name</th>
                    <th scope="col">Email</th>
                    <th scope="col">Team Id</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  
                    {%for item in data%}
                    <tr>
                        <th scope="row">{{item.id}}</th>
                        <td>{{item.username}}</td>
                        <td>{{item.email}}</td>
                        <td>{{item.team_id}}</td>
                        <td>
                            <a href ='/edituser/{{item.id}}'><button class="btn btn-success">Edit</button></a>
                            <button class="btn btn-danger" type ="button" onclick="confirmDelete('{{item.id}}')">Delete</button>
                        </td>
                    </tr>
                    {%endfor%}    
                  

        </div>

    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
